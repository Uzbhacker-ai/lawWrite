{% extends "base.html" %}

{% block title %}Kirish — LawWrite{% endblock %}

{% block content %}
<section class="auth-form">
    <h1>🔐 Kirish</h1>
    
    <form method="POST" action="{{ url_for('login') }}">
        <label for="email">Elektron pochta</label>
        <input type="email" id="email" name="email" placeholder="example@email.com" required>
        
        <label for="password">Parol</label>
        <input type="password" id="password" name="password" placeholder="Parolingizni kiriting" required>
        
        <div class="form-options">
            <label><input type="checkbox" name="remember"> Meni eslab qol</label>
            <a href="{{ url_for('forgot_password') }}">Parolni unutdingizmi?</a>
        </div>
        
        <button type="submit" class="btn-primary">Kirish</button>
    </form>
    
    <p class="auth-link">Hisobingiz yo'qmi? <a href="{{ url_for('register') }}">Ro'yxatdan o'tish</a></p>
</section>
{% endblock %}
