{% extends "base.html" %}

{% block title %}Parolni tiklash — LawWrite{% endblock %}

{% block content %}
<section class="auth-form">
    <h1>🔑 Parolni tiklash</h1>
    <p style="text-align: center; margin-bottom: 20px;">Elektron pochtangizga parolni tiklash havolasi yuboriladi.</p>
    
    <form method="POST" action="{{ url_for('forgot_password') }}">
        <label for="email">Elektron pochta</label>
        <input type="email" id="email" name="email" placeholder="example@email.com" required>
        
        <button type="submit" class="btn-primary">Havola yuborish</button>
    </form>
    
    <p class="auth-link"><a href="{{ url_for('login') }}">Kirish sahifasiga qaytish</a></p>
</section>
{% endblock %}
