{% extends "base.html" %}

{% block title %}Kursni tahrirlash — Admin{% endblock %}

{% block content %}
<section class="admin-panel">
    <h1>📚 Kursni tahrirlash</h1>
    <a href="{{ url_for('admin_courses') }}" class="btn-back"><i class="fas fa-arrow-left"></i> Kurslarga qaytish</a>
    
    <form method="POST" class="admin-form">
        <label for="title">Kurs nomi</label>
        <input type="text" id="title" name="title" value="{{ course.title }}" required>
        
        <label for="description">Tavsif</label>
        <textarea id="description" name="description" rows="3" required>{{ course.description }}</textarea>
        
        <label for="level">Daraja (A, B, C)</label>
        <input type="text" id="level" name="level" value="{{ course.level }}" required>
        
        <label for="level_name">Daraja nomi (Oson, O'rta, Qiyin)</label>
        <input type="text" id="level_name" name="level_name" value="{{ course.level_name }}" required>
        
        <label for="icon">Ikona (📚, 🔍, ⚖️)</label>
        <input type="text" id="icon" name="icon" value="{{ course.icon }}">
        
        <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Saqlash</button>
    </form>
</section>
{% endblock %}
