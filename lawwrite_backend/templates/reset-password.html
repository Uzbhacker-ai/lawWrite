{% extends "base.html" %}

{% block title %}Parolni o'zgartirish — LawWrite{% endblock %}

{% block content %}
<section class="auth-form">
    <h1>🔐 Parolni o'zgartirish</h1>
    
    <form method="POST" action="{{ url_for('reset_password', token=token) }}">
        <label for="password">Yangi parol</label>
        <input type="password" id="password" name="password" placeholder="6 ta belgidan kam bo'lmasin" required minlength="6">
        
        <label for="confirm_password">Yangi parolni takrorlang</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Parolni qayta kiriting" required>
        
        <button type="submit" class="btn-primary">Parolni o'zgartirish</button>
    </form>
</section>
{% endblock %}
